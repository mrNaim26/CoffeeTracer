<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>☕ Coffee Tracker</h1>
            <p class="subtitle">Track your daily coffee intake</p>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-label">Today</div>
                <div class="stat-value" id="todayCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">This Week</div>
                <div class="stat-value" id="weekCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Spent</div>
                <div class="stat-value" id="totalSpent">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg / Day</div>
                <div class="stat-value" id="avgPerDay">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Favorite</div>
                <div class="stat-value stat-value-small" id="mostCommonType">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">7 Day Spend</div>
                <div class="stat-value stat-value-small" id="weekSpent">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">30 Day Spend</div>
                <div class="stat-value stat-value-small" id="monthSpent">$0</div>
            </div>
        </div>

        <div class="insights-section">
            <h2>Insights</h2>
            <div id="insightsSummary" class="insights-summary">Add a coffee to see habit insights.</div>
        </div>

        <div class="add-coffee-section">
            <h2>Log a Coffee</h2>
            <form id="coffeeForm">
                <div class="form-group">
                    <label for="coffeeType">Type</label>
                    <select id="coffeeType" required>
                        <option value="Espresso">Espresso</option>
                        <option value="Americano">Americano</option>
                        <option value="Latte">Latte</option>
                        <option value="Cappuccino">Cappuccino</option>
                        <option value="Mocha">Mocha</option>
                        <option value="Cold Brew">Cold Brew</option>
                        <option value="Drip Coffee">Drip Coffee</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="coffeePrice">Price (optional)</label>
                    <input type="number" id="coffeePrice" placeholder="e.g., 4.50" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label for="coffeeNotes">Notes (optional)</label>
                    <input type="text" id="coffeeNotes" placeholder="e.g., at home, with milk">
                </div>
                <div id="formError" class="form-error" aria-live="polite"></div>
                <div class="form-actions">
                    <button type="submit" id="submitCoffee" class="btn-primary">Add Coffee</button>
                    <button type="button" id="cancelEdit" class="btn-secondary btn-cancel hidden">Cancel Edit</button>
                </div>
            </form>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h2>Coffee History</h2>
                <button id="clearHistory" class="btn-secondary">Clear All</button>
            </div>
            <div class="history-controls">
                <label for="searchCoffee" class="sr-only">Search coffee history</label>
                <input type="text" id="searchCoffee" placeholder="Search by type or notes">
                <label for="dateFilter" class="sr-only">Filter coffee history by date</label>
                <select id="dateFilter">
                    <option value="all">All dates</option>
                    <option value="today">Today</option>
                    <option value="week">Last 7 calendar days</option>
                    <option value="month">Last 30 calendar days</option>
                </select>
                <label for="sortFilter" class="sr-only">Sort coffee history</label>
                <select id="sortFilter">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="price-high">Most expensive</option>
                    <option value="price-low">Least expensive</option>
                    <option value="type">Type A-Z</option>
                </select>
            </div>
            <div id="coffeeList" class="coffee-list"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
